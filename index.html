<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>길안내</title>
<style>
:root{--bg:#f7f6f2;--fg:#1f1e1b;--mut:#6b6862;--blue:#2f6bff}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a18;--fg:#ece9e2;--mut:#a29e95;--blue:#6f97ff}}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
main{max-width:420px;margin:0 auto;padding:40px 16px;text-align:center}
h1{font-size:20px;margin:0 0 4px;overflow-wrap:anywhere}
p{color:var(--mut);font-size:14px;margin:0 0 24px}
.btn{display:block;width:100%;box-sizing:border-box;border:none;padding:16px;border-radius:14px;font:inherit;font-size:17px;font-weight:700;text-decoration:none;margin:10px 0;cursor:pointer}
.tmap{background:var(--blue);color:#fff}
.kakao{background:#fee500;color:#191919}
small{display:block;color:var(--mut);font-size:12px;margin-top:20px;line-height:1.5}
</style>
</head>
<body>
<main>
  <h1 id="name">길안내</h1>
  <p id="msg">여는 중…</p>
  <a class="btn tmap" id="tmap" href="#">티맵으로 길안내</a>
  <button class="btn kakao" id="kakao" type="button">카카오내비로 길안내</button>
  <small>앱이 바로 안 열리면 원하는 버튼을 눌러주세요.</small>
</main>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.4/kakao.min.js" crossorigin="anonymous"></script>
<script>
(function(){
  // 주소 예: ?app=tmap&n=업체명&x=126.880415&y=37.476048   (app=tmap 또는 kakao, x=경도, y=위도)
  var KAKAO_JS_KEY='cfb4ea1706c992c37efdecb65eeb53a5';
  var q=new URLSearchParams(location.search);
  // 전화: ?tel=01012345678&n=이름  → 전화 앱이 번호가 들어간 채로 열림
  var tel=(q.get('tel')||'').replace(/[^\d+]/g,'');
  if(tel){
    var who=(q.get('n')||'').slice(0,40);
    document.getElementById('name').textContent=(who?who+' ':'')+tel.replace(/^(02|0\d{2})(\d{3,4})(\d{4})$/,'$1-$2-$3');
    document.title='전화 '+tel;
    document.getElementById('kakao').style.display='none';
    var tb=document.getElementById('tmap');tb.textContent='📞 전화 걸기';tb.href='tel:'+tel;
    document.querySelector('small').textContent='전화 앱이 바로 안 열리면 위 버튼을 눌러주세요.';
    document.getElementById('msg').textContent='전화 앱을 여는 중…';
    setTimeout(function(){location.href='tel:'+tel;},150);
    setTimeout(function(){document.getElementById('msg').textContent='안 열렸으면 전화 걸기 버튼을 눌러주세요.';},2000);
    return;
  }
  var app=(q.get('app')||'tmap').toLowerCase();
  var n=(q.get('n')||'목적지').slice(0,60), x=parseFloat(q.get('x')), y=parseFloat(q.get('y'));
  var ok=isFinite(x)&&isFinite(y)&&x>124&&x<132&&y>33&&y<39.5;   // 한국 좌표만
  var msg=document.getElementById('msg');
  document.getElementById('name').textContent=n;document.title=n+' 길안내';
  if(!ok){msg.textContent='좌표가 없어서 길안내를 할 수 없어요.';
    document.getElementById('tmap').style.display='none';document.getElementById('kakao').style.display='none';return;}
  var AND=/Android/i.test(navigator.userAgent);
  // 안드로이드는 intent 주소로 열어야 크롬이 앱을 확실히 띄움 (앱 없으면 플레이스토어)
  function launch(scheme,path,pkg){return AND?('intent://'+path+'#Intent;scheme='+scheme+';package='+pkg+';end'):(scheme+'://'+path);}
  var t=launch('tmap','route?rGoName='+encodeURIComponent(n)+'&rGoX='+x+'&rGoY='+y,'com.skt.tmap.ku');
  var nv=launch('nmap','place?lat='+y+'&lng='+x+'&name='+encodeURIComponent(n)+'&appname=io.github.wovlf700code.go','com.nhn.android.nmap');
  var nvWeb='https://map.naver.com/p/search/'+encodeURIComponent(q.get('a')||n);
  document.getElementById('tmap').href=t;
  if(app==='naver'){var nb=document.getElementById('tmap');nb.textContent='네이버 지도에서 보기';nb.href=nv;nb.style.background='#03c75a';
    document.getElementById('kakao').style.display='none';
    var w=document.createElement('a');w.className='btn';w.href=nvWeb;w.textContent='앱이 없으면: 네이버 지도 웹으로';w.style.background='transparent';w.style.color='inherit';w.style.border='1px solid #ccc';nb.parentNode.insertBefore(w,nb.nextSibling);
    msg.textContent='네이버 지도를 여는 중…';setTimeout(function(){location.href=nv;},150);
    setTimeout(function(){if(/여는 중/.test(msg.textContent))msg.textContent='안 열렸으면 아래 버튼을 눌러주세요.';},2000);return;}
  function kakaoNavi(){
    try{
      if(!window.Kakao){msg.textContent='카카오 연결을 불러오지 못했어요. 잠시 뒤 다시 눌러주세요.';return;}
      if(!Kakao.isInitialized())Kakao.init(KAKAO_JS_KEY);
      Kakao.Navi.start({name:n,x:x,y:y,coordType:'wgs84'});
    }catch(e){msg.textContent='카카오내비를 열지 못했어요: '+(e&&e.message?e.message:e);}
  }
  document.getElementById('kakao').addEventListener('click',kakaoNavi);
  if(app==='kakao'){msg.textContent='카카오내비를 여는 중…';setTimeout(kakaoNavi,200);}
  else{msg.textContent='티맵을 여는 중…';setTimeout(function(){location.href=t;},150);}
  setTimeout(function(){if(/여는 중/.test(msg.textContent))msg.textContent='안 열렸으면 아래 버튼을 눌러주세요.';},2000);
})();
</script>
</body>
</html>
